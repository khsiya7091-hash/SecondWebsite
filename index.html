<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Registration System</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Employee Registration System</h1>
      <p class="subtitle">Manage onboarding for your 40 employees.</p>

      <section class="card active" id="signup-section">
        <h2>Step 1: First Sign Up</h2>
        <form id="signup-form">
          <div class="field-grid">
            <label>
              Company Name
              <input type="text" name="companyName" required />
            </label>
            <label>
              Name
              <input type="text" name="name" required />
            </label>
            <label>
              Surname
              <input type="text" name="surname" required />
            </label>
            <label>
              Bank Details
              <input type="text" name="bankDetails" required />
            </label>
            <label class="full-width">
              Directory Names and Surnames
              <textarea name="directoryNamesSurnames" rows="3" required></textarea>
            </label>
          </div>
          <button type="submit">Continue to Employee Registering</button>
        </form>
      </section>

      <section class="card" id="register-section">
        <h2>Step 2: Employee Registering Page</h2>
        <form id="register-form">
          <div class="field-grid">
            <label>
              Name
              <input type="text" name="name" required />
            </label>
            <label>
              Surname
              <input type="text" name="surname" required />
            </label>
            <label>
              ID Number
              <input type="text" name="idNumber" required />
            </label>
            <label>
              Address
              <input type="text" name="address" required />
            </label>
            <label class="full-width">
              Position
              <input type="text" name="position" required />
            </label>
          </div>
          <button type="submit">Continue to Employee Question Page</button>
        </form>
      </section>

      <section class="card" id="question-section">
        <h2>Step 3: Employee Question Page</h2>
        <form id="question-form">
          <div class="field-grid">
            <label>
              Name
              <input type="text" name="name" required />
            </label>
            <label>
              Surname
              <input type="text" name="surname" required />
            </label>
            <label class="full-width">
              Position in the Company
              <input type="text" name="position" required />
            </label>
          </div>
          <button type="submit">Generate Employee Number</button>
        </form>
      </section>

      <section class="card" id="result-section">
        <h2>Employee Created</h2>
        <p id="result-message"></p>
        <button id="add-another-btn" type="button">Register Another Employee</button>
      </section>

      <section class="card" id="employees-section">
        <h2>Registered Employees (<span id="employee-count">0</span>/40)</h2>
        <ul id="employee-list"></ul>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
